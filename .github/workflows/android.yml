
name: LAVORIA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        
        with:
          distribution: temurin
          java-version: '17'

      
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          unzip -q LAVORIA_Android_Project_Mobile_Build-1.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAVORIA-APK
          path: project/**/build/outputs/apk/debug/*.apk
